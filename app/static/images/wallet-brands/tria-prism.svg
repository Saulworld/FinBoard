<svg width="450" height="280" viewBox="0 0 450 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="450" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e1218"/>
      <stop offset="60%" stop-color="#141822"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="tealPrism" x1="0" y1="80" x2="160" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#245866" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0e2a33" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="purplePrism" x1="160" y1="70" x2="340" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4e3c63" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#221930" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="slatePrism" x1="160" y1="150" x2="340" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b3b4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111a24" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect width="450" height="280" fill="url(#bgGrad)"/>
  
  <!-- Left geometric facet: Dark Teal / Cyan -->
  <polygon points="0,85 160,65 160,215 0,185" fill="url(#tealPrism)"/>
  
  <!-- Upper right geometric facet: Deep Purple / Violet -->
  <polygon points="160,65 345,95 345,175 160,145" fill="url(#purplePrism)"/>
  
  <!-- Lower right geometric facet: Deep Slate / Navy -->
  <polygon points="160,145 345,175 285,225 160,215" fill="url(#slatePrism)"/>

  <!-- Subtle lighting edges between facets -->
  <line x1="160" y1="65" x2="160" y2="215" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <line x1="160" y1="145" x2="345" y2="175" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
</svg>
